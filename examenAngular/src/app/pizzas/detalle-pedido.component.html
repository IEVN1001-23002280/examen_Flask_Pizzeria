<div class="border border-gray-400 bg-[#b0c4de] p-4 rounded-lg shadow-md">
  <div class="overflow-x-auto bg-gray-400 border border-black rounded min-h-[180px] mb-4">
    <table class="w-full text-sm text-left border-collapse">
      <thead class="bg-gray-300 text-black border-b border-black text-xs">
        <tr>
          <th class="px-4 py-2 border-r border-black">Tamaño</th>
          <th class="px-4 py-2 border-r border-black">Ingredientes</th>
          <th class="px-4 py-2 border-r border-black">Num. Pizzas</th>
          <th class="px-4 py-2">SubTotal</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let item of pizzasDetalle; let i = index" class="border-b border-black bg-white">
          <td class="px-4 py-2 border-r border-black">{{ item.tamano }}</td>
          <td class="px-4 py-2 border-r border-black">{{ item.ingredientes }}</td>
          <td class="px-4 py-2 border-r border-black">{{ item.num_pizzas }}</td>
          <td class="px-4 py-2 flex justify-between items-center">
            ${{ item.subtotal }}
            <button (click)="quitarPizza(i)" class="bg-red-500 text-white px-2 py-0.5 rounded text-xs ml-2">X</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="flex justify-between items-center">
    <button (click)="pizzasDetalle = []; pizzeriaService.actualizarPizzas([])" class="bg-gray-300 hover:bg-gray-400 text-black border border-gray-600 px-6 py-1 rounded font-semibold shadow">Quitar</button>
    <button (click)="terminarPedido()" class="bg-gray-300 hover:bg-gray-400 text-black border border-gray-600 px-6 py-1 rounded font-semibold shadow">Terminar</button>
  </div>
</div>
