<div class="border border-gray-400 bg-[#b0c4de] p-6 rounded-lg shadow-md mb-6">
  <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
    <div>
      <label class="block font-semibold text-gray-800">Nombre:</label>
      <input [(ngModel)]="cliente.nombre" type="text" class="w-full px-3 py-1 border rounded bg-white">
    </div>
    <div>
      <label class="block font-semibold text-gray-800">Dirección:</label>
      <input [(ngModel)]="cliente.direccion" type="text" class="w-full px-3 py-1 border rounded bg-white">
    </div>
    <div>
      <label class="block font-semibold text-gray-800">Teléfono:</label>
      <input [(ngModel)]="cliente.telefono" type="text" class="w-full px-3 py-1 border rounded bg-white">
    </div>
  </div>

  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-start">
    <!-- Tamaño Pizza -->
    <div class="border p-4 rounded bg-[#b0c4de] shadow-sm">
      <h3 class="font-bold mb-2 text-gray-800 border-b pb-1">Tamaño Pizza</h3>
      <div class="space-y-2">
        <label class="block"><input type="radio" name="tamano" value="Chica" [(ngModel)]="pizzaActual.tamano"> Chica $40</label>
        <label class="block"><input type="radio" name="tamano" value="Mediana" [(ngModel)]="pizzaActual.tamano"> Mediana $80</label>
        <label class="block"><input type="radio" name="tamano" value="Grande" [(ngModel)]="pizzaActual.tamano"> Grande $120</label>
      </div>
    </div>

    <!-- Ingredientes -->
    <div class="border p-4 rounded bg-[#b0c4de] shadow-sm">
      <h3 class="font-bold mb-2 text-gray-800 border-b pb-1">Ingredientes</h3>
      <div class="space-y-2">
        <label class="block"><input type="checkbox" [(ngModel)]="pizzaActual.jamon"> Jamón $10</label>
        <label class="block"><input type="checkbox" [(ngModel)]="pizzaActual.pina"> Piña $10</label>
        <label class="block"><input type="checkbox" [(ngModel)]="pizzaActual.champinones"> Champiñones $10</label>
      </div>
    </div>

    <!-- Num de Pizzas y Botón Agregar -->
    <div class="border p-4 rounded bg-[#b0c4de] shadow-sm flex flex-col justify-between h-full">
      <div>
        <label class="block font-semibold text-gray-800 mb-2">Num. de Pizzas:</label>
        <input [(ngModel)]="pizzaActual.numPizzas" type="number" min="1" class="w-full px-3 py-1 border rounded bg-white">
      </div>
      <button (click)="agregarPizza()" class="mt-6 bg-gray-300 hover:bg-gray-400 text-black border border-gray-500 font-bold py-1 px-6 rounded shadow">
        Agregar
      </button>
    </div>
  </div>
</div>
